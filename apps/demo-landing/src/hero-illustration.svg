<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" fill="none" class="hero-illustration-svg">
  <defs>
    <linearGradient id="grad-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="grad-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.1" />
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="200" cy="120" r="90" fill="url(#grad-glow)" filter="blur(24px)" />

  <!-- Abstract UI Card Mock -->
  <rect x="70" y="30" width="260" height="170" rx="16" fill="url(#card-grad)" stroke="#334155" stroke-width="1.5" />
  
  <!-- Window Header -->
  <circle cx="95" cy="52" r="5" fill="#ef4444" opacity="0.8" />
  <circle cx="111" cy="52" r="5" fill="#f59e0b" opacity="0.8" />
  <circle cx="127" cy="52" r="5" fill="#10b981" opacity="0.8" />
  <rect x="150" y="47" width="100" height="10" rx="5" fill="#334155" />

  <!-- Code / UI Bars -->
  <rect x="95" y="80" width="130" height="12" rx="6" fill="#475569" />
  <rect x="95" y="104" width="210" height="8" rx="4" fill="#334155" />
  <rect x="95" y="122" width="170" height="8" rx="4" fill="#334155" />
  <rect x="95" y="140" width="190" height="8" rx="4" fill="#334155" />

  <!-- Glowing Agent Node -->
  <g transform="translate(230, 75)">
    <circle cx="45" cy="45" r="32" fill="url(#grad-primary)" filter="drop-shadow(0 6px 12px rgba(99,102,241,0.4))" />
    <path d="M35 45 L42 52 L55 38" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
